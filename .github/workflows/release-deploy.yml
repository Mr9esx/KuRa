name: Release Deploy

on:
  push:
    branches:
      - release

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install

      - name: Build frontend app
        run: pnpm --filter app build
        env:
          VITE_API_BASE: ""

      - name: Build admin panel
        run: pnpm --filter admin build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build Go server
        working-directory: server
        run: |
          sudo apt-get update && sudo apt-get install -y gcc
          CGO_ENABLED=1 go build -o risu-server ./cmd/

      - name: Pack build outputs
        run: |
          tar -czf release.tar.gz \
            app/dist \
            admin/dist \
            server/risu-server \
            deploy/

      - name: Upload build artifact to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: 22022
          source: release.tar.gz
          target: /tmp

      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: 22022
          script: |
            set -e

            DEPLOY_PATH="/var/www/miaoplus.com"
            RELEASE_TMP="/tmp/risu-release"

            rm -rf "${RELEASE_TMP}"
            mkdir -p "${RELEASE_TMP}" "${DEPLOY_PATH}"

            tar -xzf /tmp/release.tar.gz -C "${RELEASE_TMP}"
            rm -f /tmp/release.tar.gz

            # Deploy frontend
            rm -rf "${DEPLOY_PATH}/dist"
            mv "${RELEASE_TMP}/app/dist" "${DEPLOY_PATH}/dist"

            # Deploy admin
            rm -rf "${DEPLOY_PATH}/admin"
            mv "${RELEASE_TMP}/admin/dist" "${DEPLOY_PATH}/admin"

            # Deploy Go server
            systemctl stop risu-server || true
            cp "${RELEASE_TMP}/server/risu-server" /usr/local/bin/risu-server
            chmod +x /usr/local/bin/risu-server

            # Deploy config (only if not exists, preserve production config)
            mkdir -p /etc/risu
            if [ ! -f /etc/risu/config.yaml ]; then
              cp "${RELEASE_TMP}/deploy/config.production.yaml" /etc/risu/config.yaml
            fi

            # Deploy systemd service
            cp "${RELEASE_TMP}/deploy/systemd/risu-server.service" /etc/systemd/system/risu-server.service
            systemctl daemon-reload

            # Deploy nginx config
            cp "${RELEASE_TMP}/deploy/nginx/miaoplus.com.conf" /etc/nginx/sites-available/miaoplus.com.conf
            ln -sf /etc/nginx/sites-available/miaoplus.com.conf /etc/nginx/sites-enabled/miaoplus.com.conf

            # Cleanup
            rm -rf "${RELEASE_TMP}"

            # Restart services
            systemctl start risu-server
            nginx -t && systemctl reload nginx

            echo "Deploy finished at $(date)"
