server {
  listen 80;
  server_name miaoplus.com www.miaoplus.com risu.miaoplus.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  server_name miaoplus.com www.miaoplus.com risu.miaoplus.com;

  ssl_certificate /etc/letsencrypt/live/miaoplus.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/miaoplus.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  root /var/www/miaoplus.com/dist;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
