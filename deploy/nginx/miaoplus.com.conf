server {
  listen 80;
  server_name miaoplus.com kura.miaoplus.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  server_name miaoplus.com kura.miaoplus.com;

  ssl_certificate /etc/letsencrypt/live/miaoplus.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/miaoplus.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  root /var/www/miaoplus.com/dist;
  index index.html;

  # API reverse proxy to Go service (^~ prevents SPA fallback from intercepting /api)
  location ^~ /api/ {
    proxy_pass http://127.0.0.1:3080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Uploaded files served by Go
  location ^~ /files/ {
    proxy_pass http://127.0.0.1:3080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Redirect bare /admin to trailing slash
  location = /admin {
    return 301 /admin/;
  }

  # Admin SPA (root-based path avoids alias + try_files pitfalls)
  location ^~ /admin/ {
    root /var/www/miaoplus.com;
    index index.html;
    try_files $uri $uri/ /admin/index.html;
  }

  # Frontend SPA
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Static assets caching
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  location /images/ {
    expires 7d;
    add_header Cache-Control "public";
  }

  location /models/ {
    expires 7d;
    add_header Cache-Control "public";
  }
}
